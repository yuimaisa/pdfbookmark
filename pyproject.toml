[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfbookmark"
version = "0.1.0"
description = "OCR済み書籍PDFの目次から階層付きブックマークを生成"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.50,<2",
  "PyMuPDF>=1.24.10,<2",
  "openai>=1.68,<3",
  "pydantic>=2.8,<3",
  "rapidfuzz>=3.9,<4",
  "python-dotenv>=1.0,<2",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["pdfbookmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: opt-in live LLM API tests (costs money)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
